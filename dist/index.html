<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Your personal music studio. Turn a feeling into a song, build playlists, and find your next sound."

      type="file"
      id="cover-file"
      aria-label="Choose cover artwork"
      accept="image/png,image/jpeg,image/webp"
